<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية — منصة التعلم</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.welcome-banner {
  background:linear-gradient(135deg,#1A4F72,#2E86C1);
  border-radius:var(--radius); padding:28px 32px;
  color:white; margin-bottom:24px;
  position:relative; overflow:hidden;
}
.welcome-banner::after {
  content:'🛡️'; position:absolute;
  right:24px; top:50%; transform:translateY(-50%);
  font-size:80px; opacity:.15;
}
body.ltr .welcome-banner::after { right:auto; left:24px; }
.welcome-title { font-size:22px; font-weight:800; margin-bottom:6px; }
.welcome-sub { font-size:14px; opacity:.8; }
.welcome-tags { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.welcome-tag {
  background:rgba(255,255,255,.15); border-radius:20px;
  padding:5px 12px; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:5px;
}
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
.quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.quick-card {
  background:white; border-radius:var(--radius); border:1px solid var(--border);
  padding:18px; text-align:center; cursor:pointer; transition:var(--tr);
  box-shadow:var(--shadow); text-decoration:none; color:inherit; display:block;
}
.quick-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
.quick-card .q-icon { font-size:32px; margin-bottom:10px; }
.quick-card .q-title { font-size:14px; font-weight:700; color:var(--text); }
.quick-card .q-sub { font-size:12px; color:var(--text-muted); margin-top:4px; }
.activity-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.activity-item:last-child { border-bottom:none; }
.a-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.a-text .a-title { font-size:14px; font-weight:600; }
.a-text .a-time { font-size:12px; color:var(--text-muted); margin-top:2px; }
.a-score { font-size:15px; font-weight:800; }
</style>
</head>
<body class="rtl">
<div class="app-shell" id="shell"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const user = JSON.parse(localStorage.getItem('spf_user') || 'null');
if (!user) location.href = 'index.html';
const lang = localStorage.getItem('spf_lang') || 'ar';
const isAr = lang === 'ar';
const t = (a,e) => isAr ? a : e;

const quizResults = JSON.parse(localStorage.getItem('spf_quiz_results') || '{}');
const completedQuizzes = Object.keys(quizResults).length;
const avgScore = completedQuizzes > 0
  ? Math.round(Object.values(quizResults).flatMap(r=>r).reduce((s,r)=>s+Math.round(r.score/r.total*100),0) / Object.values(quizResults).flatMap(r=>r).length)
  : 0;

document.getElementById('shell').innerHTML = buildSidebar('dashboard.html') + `
<div class="main-content">
  ${buildTopbar('الرئيسية', 'Dashboard')}
  <div class="page-body">
    <div class="welcome-banner">
      <div class="welcome-title ar-text">مرحباً، ${user.name_ar} 👋</div>
      <div class="welcome-title en-text" style="display:none">Welcome, ${user.name_en} 👋</div>
      <div class="welcome-sub ar-text">واصل رحلتك التعليمية في صندوق الحماية الاجتماعية</div>
      <div class="welcome-sub en-text" style="display:none">Continue your learning journey at the Social Protection Fund</div>
      <div class="welcome-tags">
        <div class="welcome-tag"><i class="fas fa-calendar"></i> <span id="todayDate"></span></div>
        <div class="welcome-tag"><i class="fas fa-star"></i> <span class="ar-text">مستوى متوسط</span><span class="en-text" style="display:none">Intermediate Level</span></div>
        <div class="welcome-tag"><i class="fas fa-fire"></i> <span class="ar-text">سلسلة 3 أيام</span><span class="en-text" style="display:none">3-day streak</span></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-book-open"></i></div>
        <div>
          <div class="stat-value">6</div>
          <div class="stat-label ar-text">أبواب القانون</div>
          <div class="stat-label en-text" style="display:none">Law Chapters</div>
          <div class="stat-change up"><i class="fas fa-check"></i> <span class="ar-text">متاحة للدراسة</span><span class="en-text" style="display:none">Available</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon gold"><i class="fas fa-trophy"></i></div>
        <div>
          <div class="stat-value">${completedQuizzes}</div>
          <div class="stat-label ar-text">اختبارات مكتملة</div>
          <div class="stat-label en-text" style="display:none">Quizzes Completed</div>
          <div class="stat-change up">من 5 اختبارات</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-chart-line"></i></div>
        <div>
          <div class="stat-value">${avgScore || '--'}%</div>
          <div class="stat-label ar-text">متوسط النتائج</div>
          <div class="stat-label en-text" style="display:none">Avg Score</div>
          <div class="stat-change ${avgScore>=70?'up':'down'}">${avgScore>=70?'✓ ممتاز':'يحتاج تحسين'}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-graduation-cap"></i></div>
        <div>
          <div class="stat-value">45%</div>
          <div class="stat-label ar-text">إتمام التدريب</div>
          <div class="stat-label en-text" style="display:none">Training Progress</div>
          <div class="stat-change up ar-text">الوحدة 3 من 5</div>
          <div class="stat-change up en-text" style="display:none">Module 3 of 5</div>
        </div>
      </div>
    </div>

    <div class="quick-grid">
      <a href="laws.html" class="quick-card"><div class="q-icon">📖</div><div class="q-title ar-text">القوانين والأنظمة</div><div class="q-title en-text" style="display:none">Laws & Regs</div><div class="q-sub ar-text">6 أبواب • شرح تفاعلي</div><div class="q-sub en-text" style="display:none">6 chapters</div></a>
      <a href="quiz.html" class="quick-card"><div class="q-icon">🎯</div><div class="q-title ar-text">الاختبارات</div><div class="q-title en-text" style="display:none">Quizzes</div><div class="q-sub ar-text">5 اختبارات متاحة</div><div class="q-sub en-text" style="display:none">5 quizzes</div></a>
      <a href="training.html" class="quick-card"><div class="q-icon">🎓</div><div class="q-title ar-text">البرامج التدريبية</div><div class="q-title en-text" style="display:none">Training</div><div class="q-sub ar-text">3 برامج مخصصة</div><div class="q-sub en-text" style="display:none">3 programs</div></a>
      <a href="knowledge.html" class="quick-card"><div class="q-icon">📚</div><div class="q-title ar-text">قاعدة المعرفة</div><div class="q-title en-text" style="display:none">Knowledge Base</div><div class="q-sub ar-text">12 مقالة مرجعية</div><div class="q-sub en-text" style="display:none">12 articles</div></a>
    </div>

    <div class="charts-grid">
      <div class="card">
        <div class="card-header"><span class="card-title ar-text">نتائج الاختبارات</span><span class="card-title en-text" style="display:none">Quiz Scores</span></div>
        <div class="card-body"><canvas id="quizChart" height="200"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title ar-text">تقدم التدريب</span><span class="card-title en-text" style="display:none">Training Progress</span></div>
        <div class="card-body">
          ${['التعريفات والأحكام العامة','فروع منافع الحماية','فروع التأمين الاجتماعي','إجراءات الخدمة','الاستعداد الشامل'].map((lbl,i)=>{
            const scores=[88,72,0,0,0];
            return `<div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                <span style="font-size:13px;font-weight:600">${lbl}</span>
                <span style="font-size:13px;font-weight:700;color:var(--primary)">${scores[i]?scores[i]+'%':'--'}</span>
              </div>
              <div class="progress-bar"><div class="progress-fill ${i<2?'':i<3?'gold':''}" style="width:${scores[i]}%"></div></div>
            </div>`}).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title ar-text">النشاط الأخير</span>
        <span class="card-title en-text" style="display:none">Recent Activity</span>
      </div>
      <div class="card-body">
        <div class="activity-item">
          <div class="a-icon" style="background:#EFF6FF;color:var(--primary)"><i class="fas fa-question-circle"></i></div>
          <div class="a-text" style="flex:1">
            <div class="a-title ar-text">اختبار: التعريفات والأحكام العامة</div>
            <div class="a-title en-text" style="display:none">Quiz: Definitions & General Provisions</div>
            <div class="a-time">اليوم، 10:30 ص</div>
          </div>
          <div class="a-score" style="color:var(--green)">88%</div>
        </div>
        <div class="activity-item">
          <div class="a-icon" style="background:#F0FDF4;color:var(--green)"><i class="fas fa-book"></i></div>
          <div class="a-text" style="flex:1">
            <div class="a-title ar-text">قرأت: الباب الأول — التعريفات</div>
            <div class="a-title en-text" style="display:none">Read: Chapter 1 — Definitions</div>
            <div class="a-time ar-text">أمس، 2:15 م</div>
            <div class="a-time en-text" style="display:none">Yesterday, 2:15 PM</div>
          </div>
          <div class="badge badge-green ar-text">مكتمل</div>
          <div class="badge badge-green en-text" style="display:none">Done</div>
        </div>
        <div class="activity-item">
          <div class="a-icon" style="background:#FFFBEB;color:var(--gold-dark)"><i class="fas fa-graduation-cap"></i></div>
          <div class="a-text" style="flex:1">
            <div class="a-title ar-text">أتممت: الوحدة 2 — أساسيات القانون</div>
            <div class="a-title en-text" style="display:none">Completed: Module 2 — Law Fundamentals</div>
            <div class="a-time ar-text">منذ يومين</div>
            <div class="a-time en-text" style="display:none">2 days ago</div>
          </div>
          <div class="badge badge-gold ar-text">وحدة مكتملة</div>
          <div class="badge badge-gold en-text" style="display:none">Module Done</div>
        </div>
      </div>
    </div>
  </div>
</div>`;

App.lang = lang;
App.user = user;
App.applyLang();
App.bindLangToggle();

const today = new Date();
document.getElementById('todayDate').textContent = today.toLocaleDateString(isAr?'ar-OM':'en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

new Chart(document.getElementById('quizChart'), {
  type:'bar',
  data:{
    labels: isAr
      ? ['التعريفات','فروع المنافع','فروع التأمين','إجراءات الخدمة','الاستعداد']
      : ['Definitions','Benefit Branches','Insurance','Procedures','Readiness'],
    datasets:[{
      label: isAr ? 'النتيجة %' : 'Score %',
      data:[88,72,0,0,0],
      backgroundColor:['#2E86C1','#27AE60','#E2E8F0','#E2E8F0','#E2E8F0'],
      borderRadius:8, borderSkipped:false
    }]
  },
  options:{
    responsive:true,
    plugins:{legend:{display:false}},
    scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#F0F4F8'}},x:{grid:{display:false}}}
  }
});

document.querySelectorAll('.logout-btn').forEach(el=>el.addEventListener('click',()=>{ localStorage.removeItem('spf_user'); location.href='index.html'; }));
</script>
</body>
</html>
