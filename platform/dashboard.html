<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية — منصة التعلم</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.welcome-banner {
  background:linear-gradient(135deg,#1A4F72,#2E86C1);
  border-radius:var(--radius); padding:28px 32px;
  color:white; margin-bottom:24px;
  position:relative; overflow:hidden;
}
.welcome-banner::after {
  content:'🛡️'; position:absolute;
  right:24px; top:50%; transform:translateY(-50%);
  font-size:80px; opacity:.15;
}
body.ltr .welcome-banner::after { right:auto; left:24px; }
.welcome-title { font-size:22px; font-weight:800; margin-bottom:6px; }
.welcome-sub { font-size:14px; opacity:.8; }
.welcome-tags { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.welcome-tag {
  background:rgba(255,255,255,.15); border-radius:20px;
  padding:5px 12px; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:5px;
}
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
.quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.quick-card {
  background:white; border-radius:var(--radius); border:1px solid var(--border);
  padding:18px; text-align:center; cursor:pointer; transition:var(--tr);
  box-shadow:var(--shadow); text-decoration:none; color:inherit; display:block;
}
.quick-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
.quick-card .q-icon { font-size:32px; margin-bottom:10px; }
.quick-card .q-title { font-size:14px; font-weight:700; color:var(--text); }
.quick-card .q-sub { font-size:12px; color:var(--text-muted); margin-top:4px; }
.activity-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.activity-item:last-child { border-bottom:none; }
.a-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.a-text .a-title { font-size:14px; font-weight:600; }
.a-text .a-time { font-size:12px; color:var(--text-muted); margin-top:2px; }
.a-score { font-size:15px; font-weight:800; }
</style>
</head>
<body class="rtl">
<div class="app-shell" id="shell"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const user = (function() { try { return JSON.parse(localStorage.getItem('spf_user') || 'null'); } catch(e) { return null; } })();
if (!user) location.href = 'index.html';
const lang = (function() { try { return localStorage.getItem('spf_lang') || 'ar'; } catch(e) { return 'ar'; } })();
const isAr = lang === 'ar';
const t = (a,e) => isAr ? a : e;
const PASS_SCORE = 80;

// Real data from localStorage
const quizResults = App.getQuizResults();
const completedQuizzes = Object.keys(quizResults).length;
const latestAttempts = Object.values(quizResults).map(arr => arr[arr.length-1]);
const avgScore = latestAttempts.length > 0
  ? Math.round(latestAttempts.reduce((s,r) => s + r.score, 0) / latestAttempts.length)
  : 0;
const passedQuizzes = latestAttempts.filter(r => r.score >= PASS_SCORE).length;

// Real training progress from localStorage
const progress = App.getProgress();
var totalModules = 0, completedModules = 0;
if (typeof SPF !== 'undefined' && SPF.training_programs) {
  SPF.training_programs.forEach(function(prog) {
    prog.modules.forEach(function(mod) {
      totalModules++;
      if (progress['mod_' + prog.id + '_' + mod.id] || mod.status === 'done') completedModules++;
    });
  });
}
const trainingPct = totalModules > 0 ? Math.round((completedModules / totalModules) * 100) : 0;
const trainingLabel = totalModules > 0
  ? completedModules + '/' + totalModules + (isAr ? ' وحدة' : ' modules')
  : (isAr ? 'لا يوجد بيانات' : 'No data');

// Build recent quiz activity from real results
var recentActivityHtml = '';
var quizResultEntries = [];
Object.keys(quizResults).forEach(function(qid) {
  var arr = quizResults[qid];
  var quiz = SPF && SPF.quizzes ? SPF.quizzes.find(function(q) { return q.id == qid; }) : null;
  arr.forEach(function(r) {
    quizResultEntries.push({ quiz: quiz, result: r, score: r.score });
  });
});
quizResultEntries.sort(function(a,b) { return b.score - a.score; });
var shown = quizResultEntries.slice(0,3);
if (shown.length > 0) {
  recentActivityHtml = shown.map(function(entry) {
    var color = entry.score >= PASS_SCORE ? 'var(--success)' : entry.score >= 60 ? 'var(--gold)' : 'var(--danger)';
    var title_ar = entry.quiz ? entry.quiz.title_ar : 'اختبار';
    var title_en = entry.quiz ? entry.quiz.title_en : 'Quiz';
    return '<div class="activity-item">' +
      '<div class="a-icon" style="background:#EFF6FF;color:var(--primary)"><i class="fas fa-question-circle"></i></div>' +
      '<div class="a-text" style="flex:1">' +
        '<div class="a-title ar-text">' + title_ar + '</div>' +
        '<div class="a-title en-text" style="display:none">' + title_en + '</div>' +
        '<div class="a-time">' + (entry.result.date || '') + '</div>' +
      '</div>' +
      '<div class="a-score" style="color:' + color + '">' + entry.score + '%</div>' +
    '</div>';
  }).join('');
} else {
  recentActivityHtml =
    '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:.9rem;">' +
      '<span class="ar-text">لا يوجد نشاط بعد — ابدأ باختبار!</span>' +
      '<span class="en-text" style="display:none">No activity yet — take a quiz!</span>' +
    '</div>';
}

document.getElementById('shell').innerHTML = buildSidebar('dashboard.html') + `
<div class="main-content">
  ${buildTopbar('الرئيسية', 'Dashboard')}
  <div class="page-body">
    <div class="welcome-banner">
      <div class="welcome-title ar-text">مرحباً، ${user.name_ar} 👋</div>
      <div class="welcome-title en-text" style="display:none">Welcome, ${user.name_en} 👋</div>
      <div class="welcome-sub ar-text">واصل رحلتك التعليمية في صندوق الحماية الاجتماعية</div>
      <div class="welcome-sub en-text" style="display:none">Continue your learning journey at the Social Protection Fund</div>
      <div class="welcome-tags">
        <div class="welcome-tag"><i class="fas fa-calendar"></i> <span id="todayDate"></span></div>
        <div class="welcome-tag"><i class="fas fa-bullseye"></i> <span class="ar-text">النجاح: ${PASS_SCORE}%</span><span class="en-text" style="display:none">Pass mark: ${PASS_SCORE}%</span></div>
        <div class="welcome-tag"><i class="fas fa-trophy"></i> <span class="ar-text">ناجح: ${passedQuizzes} اختبار</span><span class="en-text" style="display:none">Passed: ${passedQuizzes} quiz</span></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-book-open"></i></div>
        <div>
          <div class="stat-value">6</div>
          <div class="stat-label ar-text">أبواب القانون</div>
          <div class="stat-label en-text" style="display:none">Law Chapters</div>
          <div class="stat-change up"><i class="fas fa-check"></i> <span class="ar-text">متاحة للدراسة</span><span class="en-text" style="display:none">Available</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon gold"><i class="fas fa-trophy"></i></div>
        <div>
          <div class="stat-value">${completedQuizzes}</div>
          <div class="stat-label ar-text">اختبارات مكتملة</div>
          <div class="stat-label en-text" style="display:none">Quizzes Completed</div>
          <div class="stat-change up ar-text">من ${SPF && SPF.quizzes ? SPF.quizzes.length : 5} اختبارات</div>
          <div class="stat-change up en-text" style="display:none">of ${SPF && SPF.quizzes ? SPF.quizzes.length : 5} quizzes</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-chart-line"></i></div>
        <div>
          <div class="stat-value">${avgScore ? avgScore+'%' : '--'}</div>
          <div class="stat-label ar-text">متوسط النتائج</div>
          <div class="stat-label en-text" style="display:none">Avg Score</div>
          <div class="stat-change ${avgScore >= PASS_SCORE ? 'up' : 'down'} ar-text">${avgScore >= PASS_SCORE ? '✓ ممتاز' : avgScore > 0 ? 'يحتاج تحسين' : 'لم تبدأ بعد'}</div>
          <div class="stat-change ${avgScore >= PASS_SCORE ? 'up' : 'down'} en-text" style="display:none">${avgScore >= PASS_SCORE ? '✓ Excellent' : avgScore > 0 ? 'Needs improvement' : 'Not started'}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-graduation-cap"></i></div>
        <div>
          <div class="stat-value">${trainingPct}%</div>
          <div class="stat-label ar-text">إتمام التدريب</div>
          <div class="stat-label en-text" style="display:none">Training Progress</div>
          <div class="stat-change up ar-text">${trainingLabel}</div>
          <div class="stat-change up en-text" style="display:none">${trainingLabel}</div>
        </div>
      </div>
    </div>

    <div class="quick-grid">
      <a href="laws.html" class="quick-card"><div class="q-icon">📖</div><div class="q-title ar-text">القوانين والأنظمة</div><div class="q-title en-text" style="display:none">Laws & Regs</div><div class="q-sub ar-text">6 أبواب • شرح تفاعلي</div><div class="q-sub en-text" style="display:none">6 chapters</div></a>
      <a href="quiz.html" class="quick-card"><div class="q-icon">🎯</div><div class="q-title ar-text">الاختبارات</div><div class="q-title en-text" style="display:none">Quizzes</div><div class="q-sub ar-text">${SPF && SPF.quizzes ? SPF.quizzes.length : 5} اختبارات متاحة</div><div class="q-sub en-text" style="display:none">${SPF && SPF.quizzes ? SPF.quizzes.length : 5} quizzes</div></a>
      <a href="training.html" class="quick-card"><div class="q-icon">🎓</div><div class="q-title ar-text">البرامج التدريبية</div><div class="q-title en-text" style="display:none">Training</div><div class="q-sub ar-text">3 برامج مخصصة</div><div class="q-sub en-text" style="display:none">3 programs</div></a>
      <a href="knowledge.html" class="quick-card"><div class="q-icon">📚</div><div class="q-title ar-text">قاعدة المعرفة</div><div class="q-title en-text" style="display:none">Knowledge Base</div><div class="q-sub ar-text">مقالات مرجعية</div><div class="q-sub en-text" style="display:none">Reference articles</div></a>
    </div>

    <div class="charts-grid">
      <div class="card">
        <div class="card-header"><span class="card-title ar-text">نتائج الاختبارات</span><span class="card-title en-text" style="display:none">Quiz Scores</span></div>
        <div class="card-body"><canvas id="quizChart" height="200"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title ar-text">تقدم التدريب</span><span class="card-title en-text" style="display:none">Training Progress</span></div>
        <div class="card-body" id="trainingBars"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title ar-text">نشاط الاختبارات</span>
        <span class="card-title en-text" style="display:none">Quiz Activity</span>
      </div>
      <div class="card-body" id="recentActivity">${recentActivityHtml}</div>
    </div>
  </div>
</div>`;

App.lang = lang;
App.user = user;
App.applyLang();
App.bindLangToggle();
App.applyDark();
App.restoreSidebar();

const today = new Date();
document.getElementById('todayDate').textContent = today.toLocaleDateString(isAr?'ar-OM':'en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

// Quiz scores chart from real results
const allResults = App.getQuizResults();
const chartLabels = SPF && SPF.quizzes ? SPF.quizzes.map(q => isAr ? q.title_ar.split(':')[0] : q.title_en.split(':')[0]) : [];
const chartScores = SPF && SPF.quizzes ? SPF.quizzes.map(q => {
  const arr = allResults[q.id];
  if (!arr || !arr.length) return 0;
  return arr[arr.length-1].score;
}) : [];
const chartColors = chartScores.map(s => s > 0 ? (s >= PASS_SCORE ? '#22c55e' : s >= 60 ? '#C8A951' : '#ef4444') : '#E2E8F0');

if (chartLabels.length > 0) {
  new Chart(document.getElementById('quizChart'), {
    type:'bar',
    data:{
      labels: chartLabels,
      datasets:[{
        label: isAr ? 'النتيجة %' : 'Score %',
        data: chartScores,
        backgroundColor: chartColors,
        borderRadius:8, borderSkipped:false
      }]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{
        y:{min:0,max:100,ticks:{callback:function(v){return v+'%'}},grid:{color:'#F0F4F8'}},
        x:{grid:{display:false}}
      }
    }
  });
}

// Training bars from real progress
var trainingBarsHtml = '';
if (SPF && SPF.training_programs) {
  SPF.training_programs.forEach(function(prog) {
    var done = 0;
    prog.modules.forEach(function(mod) {
      if (progress['mod_' + prog.id + '_' + mod.id] || mod.status === 'done') done++;
    });
    var pct = prog.modules.length > 0 ? Math.round((done / prog.modules.length) * 100) : 0;
    var label = isAr ? prog.title_ar : prog.title_en;
    trainingBarsHtml +=
      '<div style="margin-bottom:14px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:5px;">' +
          '<span style="font-size:13px;font-weight:600">' + label + '</span>' +
          '<span style="font-size:13px;font-weight:700;color:var(--primary)">' + (pct > 0 ? pct + '%' : '--') + '</span>' +
        '</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
  });
}
if (!trainingBarsHtml) {
  trainingBarsHtml = '<p style="color:var(--text-muted);font-size:.9rem;text-align:center;padding:20px 0;">' +
    '<span class="ar-text">لا توجد برامج تدريبية</span>' +
    '<span class="en-text" style="display:none">No training programs</span>' +
    '</p>';
}
var trainingBarsEl = document.getElementById('trainingBars');
if (trainingBarsEl) { trainingBarsEl.innerHTML = trainingBarsHtml; App.applyLang(); }

document.querySelectorAll('.logout-btn').forEach(el=>el.addEventListener('click',()=>App.logout()));
</script>
</body>
</html>
