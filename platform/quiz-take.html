<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار — صندوق الحماية الاجتماعية</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.quiz-shell { max-width: 720px; margin: 0 auto; }
.quiz-topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding:16px 20px; background:var(--surface); border-radius:14px; border:1px solid var(--border); gap:16px; flex-wrap:wrap; }
.quiz-progress-text { font-size:.85rem; color:var(--text-muted); }
.quiz-progress-text strong { color:var(--primary); font-size:1rem; }
.timer { display:flex; align-items:center; gap:8px; font-size:1rem; font-weight:700; color:var(--primary); }
.timer.warning { color:var(--danger); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.prog-wrap { flex:1; min-width:140px; }
.prog-wrap .bar { background:var(--border); border-radius:999px; height:8px; }
.prog-wrap .fill { height:8px; border-radius:999px; background:var(--primary); transition:width .4s; }
.question-card { background:var(--surface); border-radius:14px; border:1px solid var(--border); padding:28px; margin-bottom:16px; }
.q-num { font-size:.8rem; font-weight:700; color:var(--text-muted); margin-bottom:8px; }
.q-text { font-size:1.1rem; font-weight:700; line-height:1.7; margin-bottom:22px; }
.options-list { display:flex; flex-direction:column; gap:10px; }
.option-item { display:flex; align-items:center; gap:14px; padding:14px 18px; border:2px solid var(--border); border-radius:10px; cursor:pointer; transition:all .2s; background:var(--bg); user-select:none; }
.option-item:hover:not(.disabled) { border-color:var(--primary); background:rgba(26,79,114,.05); }
.option-item.selected { border-color:var(--primary); background:rgba(26,79,114,.08); }
.option-item.correct { border-color:var(--success); background:rgba(34,197,94,.08); }
.option-item.wrong { border-color:var(--danger); background:rgba(239,68,68,.08); }
.option-item.disabled { cursor:default; }
.option-letter { width:32px; height:32px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; flex-shrink:0; transition:all .2s; }
.option-item.selected .option-letter { background:var(--primary); color:#fff; border-color:var(--primary); }
.option-item.correct .option-letter { background:var(--success); color:#fff; border-color:var(--success); }
.option-item.wrong .option-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.option-text { flex:1; font-size:.95rem; line-height:1.5; }
.feedback-box { margin-top:14px; padding:12px 16px; border-radius:8px; font-size:.88rem; font-weight:600; display:none; }
.feedback-box.show { display:block; }
.feedback-box.correct-fb { background:rgba(34,197,94,.12); color:#15803d; border:1px solid rgba(34,197,94,.3); }
.feedback-box.wrong-fb { background:rgba(239,68,68,.1); color:#b91c1c; border:1px solid rgba(239,68,68,.25); }
.nav-btns { display:flex; gap:12px; justify-content:space-between; margin-top:20px; }
.nav-btn { padding:12px 28px; border:none; border-radius:9px; font-family:inherit; font-size:.95rem; font-weight:700; cursor:pointer; transition:all .2s; }
.nav-btn.primary { background:var(--primary); color:#fff; }
.nav-btn.primary:hover { opacity:.9; }
.nav-btn.secondary { background:var(--bg); color:var(--text); border:1.5px solid var(--border); }
.nav-btn.secondary:hover { border-color:var(--primary); color:var(--primary); }
.nav-btn:disabled { opacity:.4; cursor:not-allowed; }
.result-screen { text-align:center; padding:40px 24px; }
.result-circle { width:140px; height:140px; border-radius:50%; margin:0 auto 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:2.2rem; font-weight:900; border:6px solid; }
.result-circle.pass { border-color:var(--success); color:var(--success); background:rgba(34,197,94,.08); }
.result-circle.fail { border-color:var(--danger); color:var(--danger); background:rgba(239,68,68,.07); }
.result-label { font-size:.8rem; font-weight:600; margin-top:2px; }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:24px 0; }
.result-stat { background:var(--bg); border-radius:10px; padding:14px; border:1px solid var(--border); }
.result-stat .val { font-size:1.4rem; font-weight:800; color:var(--primary); }
.result-stat .lbl { font-size:.75rem; color:var(--text-muted); margin-top:2px; }
.review-section { text-align:right; margin-top:20px; }
body.ltr .review-section { text-align:left; }
.review-q { padding:14px; background:var(--bg); border-radius:10px; margin-bottom:10px; border:1px solid var(--border); border-right:4px solid transparent; }
body.ltr .review-q { border-right:none; border-left:4px solid transparent; }
.review-q.correct-q { border-right-color:var(--success); }
.review-q.wrong-q { border-right-color:var(--danger); }
body.ltr .review-q.correct-q { border-left-color:var(--success); }
body.ltr .review-q.wrong-q { border-left-color:var(--danger); }
</style>
</head>
<body class="page-layout">
<canvas id="confettiCanvas"></canvas>
<div id="shell"></div>
<div class="page-content">
  <div class="quiz-shell">
    <div id="quizArea"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
App.requireAuth();
document.getElementById('shell').innerHTML = buildSidebar('quiz.html') + buildTopbar('الاختبار','Quiz');
App.init();
const params = new URLSearchParams(window.location.search);
const quizId = parseInt(params.get('quiz')) || 1;
const quiz = SPF.quizzes.find(q => q.id === quizId);
const PASS_SCORE = 70;
if (!quiz) {
  document.getElementById('quizArea').innerHTML = '<div class="card" style="text-align:center;padding:40px;"><p>الاختبار غير موجود. <a href="quiz.html">العودة</a></p></div>';
} else { startQuiz(); }
let currentQ = 0;
let answers = [];
let timerInterval = null;
let secondsLeft = 0;
let quizDone = false;
function startQuiz() {
  currentQ = 0;
  answers = new Array(quiz.questions.length).fill(null);
  secondsLeft = (quiz.time_min || 15) * 60;
  quizDone = false;
  renderQuestion();
  startTimer();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    secondsLeft--;
    updateTimer();
    if (secondsLeft <= 0) { clearInterval(timerInterval); finishQuiz(); }
  }, 1000);
}
function updateTimer() {
  var el = document.getElementById('timerDisplay');
  if (!el) return;
  var m = Math.floor(secondsLeft / 60);
  var s = secondsLeft % 60;
  el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var timerEl = el.closest('.timer');
  if (timerEl) {
    if (secondsLeft <= 60) timerEl.classList.add('warning');
    else timerEl.classList.remove('warning');
  }
}
function renderQuestion() {
  var q = quiz.questions[currentQ];
  var letters = ['أ','ب','ج','د','هـ','و'];
  var lettersEn = ['A','B','C','D','E','F'];
  var answered = answers[currentQ] !== null;
  var chosen = answers[currentQ];
  var progressPct = (currentQ / quiz.questions.length) * 100;
  var isLtr = document.body.classList.contains('ltr');
  var optionsHtml = '';
  for (var i = 0; i < q.options_ar.length; i++) {
    var cls = '';
    if (answered) {
      cls = 'disabled';
      if (i === q.correct) cls += ' correct';
      else if (i === chosen) cls += ' wrong';
    } else if (i === chosen) cls = 'selected';
    var icon = '';
    if (answered && i === q.correct) icon = '<i class="fa-solid fa-circle-check" style="color:var(--success);"></i>';
    else if (answered && i === chosen && i !== q.correct) icon = '<i class="fa-solid fa-circle-xmark" style="color:var(--danger);"></i>';
    optionsHtml += '<div class="option-item ' + cls + '" onclick="selectOption(' + i + ')" id="opt_' + i + '">' +
      '<div class="option-letter">' + (isLtr ? lettersEn[i] : letters[i]) + '</div>' +
      '<div class="option-text"><span class="ar-text">' + q.options_ar[i] + '</span><span class="en-text">' + q.options_en[i] + '</span></div>' +
      icon + '</div>';
  }
  var feedbackHtml = '';
  if (answered) {
    var fbCls = chosen === q.correct ? 'correct-fb' : 'wrong-fb';
    var fbIcon = chosen === q.correct ? 'fa-circle-check' : 'fa-triangle-exclamation';
    var fbMsg = chosen === q.correct
      ? '<span class="ar-text"> إجابة صحيحة! أحسنت.</span><span class="en-text"> Correct! Well done.</span>'
      : '<span class="ar-text"> الإجابة الصحيحة: ' + q.options_ar[q.correct] + '</span><span class="en-text"> Correct: ' + q.options_en[q.correct] + '</span>';
    feedbackHtml = '<div class="feedback-box ' + fbCls + ' show"><i class="fa-solid ' + fbIcon + '"></i>' + fbMsg + '</div>';
  }
  var navRight = currentQ < quiz.questions.length - 1
    ? '<button class="nav-btn primary" onclick="nextQ()"><span class="ar-text">التالي </span><span class="en-text">Next </span><i class="fa-solid fa-chevron-left"></i></button>'
    : '<button class="nav-btn primary" onclick="finishQuiz()" style="background:var(--success);"><i class="fa-solid fa-flag-checkered"></i><span class="ar-text"> إنهاء الاختبار</span><span class="en-text"> Finish Quiz</span></button>';
  var dotNav = '';
  for (var j = 0; j < quiz.questions.length; j++) {
    var bg = 'var(--border)';
    if (answers[j] !== null) bg = answers[j] === quiz.questions[j].correct ? 'var(--success)' : 'var(--danger)';
    else if (j === currentQ) bg = 'var(--primary)';
    var dotColor = (j === currentQ || answers[j] !== null) ? '#fff' : 'var(--text-muted)';
    dotNav += '<div onclick="goQ(' + j + ')" style="width:28px;height:28px;border-radius:50%;background:' + bg + ';cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:' + dotColor + ';">' + (j+1) + '</div>';
  }
  document.getElementById('quizArea').innerHTML =
    '<div class="quiz-topbar">' +
      '<div class="quiz-progress-text"><span class="ar-text">السؤال <strong>' + (currentQ+1) + '</strong> من ' + quiz.questions.length + '</span><span class="en-text">Question <strong>' + (currentQ+1) + '</strong> of ' + quiz.questions.length + '</span></div>' +
      '<div class="prog-wrap"><div class="bar"><div class="fill" style="width:' + progressPct + '%"></div></div></div>' +
      '<div class="timer" id="timerWrap"><i class="fa-regular fa-clock"></i><span id="timerDisplay">--:--</span></div>' +
    '</div>' +
    '<div class="question-card">' +
      '<div class="q-num"><span class="ar-text">سؤال ' + (currentQ+1) + '</span><span class="en-text">Question ' + (currentQ+1) + '</span>&nbsp;&middot;&nbsp;<span class="ar-text">' + quiz.title_ar + '</span><span class="en-text">' + quiz.title_en + '</span></div>' +
      '<div class="q-text"><span class="ar-text">' + q.q_ar + '</span><span class="en-text">' + q.q_en + '</span></div>' +
      '<div class="options-list">' + optionsHtml + '</div>' +
      feedbackHtml +
    '</div>' +
    '<div class="nav-btns">' +
      '<button class="nav-btn secondary" onclick="prevQ()" ' + (currentQ === 0 ? 'disabled' : '') + '><i class="fa-solid fa-chevron-right"></i><span class="ar-text"> السابق</span><span class="en-text"> Previous</span></button>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">' + dotNav + '</div>' +
      navRight +
    '</div>';
  updateTimer();
  App.applyLang();
}
function selectOption(i) {
  if (answers[currentQ] !== null || quizDone) return;
  answers[currentQ] = i;
  renderQuestion();
}
function nextQ() { if (currentQ < quiz.questions.length - 1) { currentQ++; renderQuestion(); } }
function prevQ() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function goQ(i) { currentQ = i; renderQuestion(); }
function finishQuiz() {
  clearInterval(timerInterval);
  quizDone = true;
  var correct = 0;
  for (var i = 0; i < answers.length; i++) { if (answers[i] === quiz.questions[i].correct) correct++; }
  var total = quiz.questions.length;
  var score = Math.round((correct / total) * 100);
  var passed = score >= PASS_SCORE;
  App.saveQuizResult(quizId, score, correct, total);
  if (passed) launchConfetti();
  var timeTaken = (quiz.time_min || 15) * 60 - secondsLeft;
  var mins = Math.floor(timeTaken / 60);
  var secs = timeTaken % 60;
  var reviewHtml = '';
  for (var i = 0; i < quiz.questions.length; i++) {
    var q = quiz.questions[i];
    var cho = answers[i];
    var isOk = cho === q.correct;
    reviewHtml += '<div class="review-q ' + (isOk ? 'correct-q' : 'wrong-q') + '">' +
      '<div style="display:flex;align-items:flex-start;gap:10px;">' +
      '<div style="flex-shrink:0;margin-top:2px;"><i class="fa-solid ' + (isOk ? 'fa-circle-check' : 'fa-circle-xmark') + '" style="color:' + (isOk ? 'var(--success)' : 'var(--danger)') + ';"></i></div>' +
      '<div style="flex:1;"><div style="font-size:.9rem;font-weight:600;margin-bottom:6px;"><span class="ar-text">' + (i+1) + '. ' + q.q_ar + '</span><span class="en-text">' + (i+1) + '. ' + q.q_en + '</span></div>' +
      (!isOk ? '<div style="font-size:.82rem;color:var(--danger);margin-bottom:3px;"><span class="ar-text">إجابتك: ' + (cho !== null ? q.options_ar[cho] : 'لم تجب') + '</span><span class="en-text">Your answer: ' + (cho !== null ? q.options_en[cho] : 'Not answered') + '</span></div>' : '') +
      '<div style="font-size:.82rem;color:var(--success);font-weight:600;"><span class="ar-text">الصحيح: ' + q.options_ar[q.correct] + '</span><span class="en-text">Correct: ' + q.options_en[q.correct] + '</span></div>' +
      '</div></div></div>';
  }
  document.getElementById('quizArea').innerHTML =
    '<div class="card result-screen">' +
      '<div class="result-circle ' + (passed ? 'pass' : 'fail') + '">' +
        '<div>' + score + '%</div>' +
        '<div class="result-label">' + (passed ? '<span class="ar-text">ناجح</span><span class="en-text">Pass</span>' : '<span class="ar-text">راسب</span><span class="en-text">Fail</span>') + '</div>' +
      '</div>' +
      '<h2 style="font-size:1.3rem;margin-bottom:6px;">' + (passed
        ? '<span class="ar-text">مبروك! لقد اجتزت الاختبار بنجاح</span><span class="en-text">Congratulations! You passed!</span>'
        : '<span class="ar-text">للأسف لم تجتز الاختبار، حاول مرة أخرى</span><span class="en-text">You did not pass. Please try again.</span>') + '</h2>' +
      '<p style="color:var(--text-muted);font-size:.9rem;"><span class="ar-text">' + quiz.title_ar + '</span><span class="en-text">' + quiz.title_en + '</span></p>' +
      '<div class="result-stats">' +
        '<div class="result-stat"><div class="val">' + correct + '/' + total + '</div><div class="lbl"><span class="ar-text">إجابات صحيحة</span><span class="en-text">Correct</span></div></div>' +
        '<div class="result-stat"><div class="val">' + mins + ':' + (secs < 10 ? '0' : '') + secs + '</div><div class="lbl"><span class="ar-text">وقت الإجابة</span><span class="en-text">Time Taken</span></div></div>' +
        '<div class="result-stat"><div class="val" style="color:' + (passed ? 'var(--success)' : 'var(--danger)') + ';">' + PASS_SCORE + '%</div><div class="lbl"><span class="ar-text">درجة النجاح</span><span class="en-text">Pass Score</span></div></div>' +
      '</div>' +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">' +
        '<button class="nav-btn secondary" onclick="window.location.href=\'quiz.html\'"><i class="fa-solid fa-list"></i><span class="ar-text"> كل الاختبارات</span><span class="en-text"> All Quizzes</span></button>' +
        '<button class="nav-btn primary" onclick="startQuiz()"><i class="fa-solid fa-rotate-right"></i><span class="ar-text"> إعادة الاختبار</span><span class="en-text"> Retake</span></button>' +
        '<button class="nav-btn primary" onclick="window.location.href=\'laws.html\'" style="background:var(--gold);color:#1a1a1a;"><i class="fa-solid fa-book-open"></i><span class="ar-text"> مراجعة القانون</span><span class="en-text"> Review Law</span></button>' +
      '</div>' +
      '<div class="review-section"><h3 style="font-size:1rem;font-weight:700;margin-bottom:14px;border-bottom:2px solid var(--border);padding-bottom:10px;"><span class="ar-text">مراجعة الإجابات</span><span class="en-text">Answer Review</span></h3>' + reviewHtml + '</div>' +
    '</div>';
  App.applyLang();
}

function launchConfetti() {
  var canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var pieces = [];
  var colors = ['#1A4F72','#C8A951','#22c55e','#ef4444','#a855f7','#3b82f6'];
  for (var i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      w: 8 + Math.random() * 8,
      h: 5 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 4,
      vx: (Math.random() - 0.5) * 3,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 6
    });
  }
  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function(p) {
      p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - frame / 120);
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 140) requestAnimationFrame(draw);
    else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  draw();
}
</script>
</body>
</html>
