<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاعدة المعرفة — صندوق الحماية الاجتماعية</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.kb-toolbar { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center; }
.kb-search-wrap { flex:1; min-width:200px; position:relative; }
.kb-search { width:100%; padding:12px 16px 12px 42px; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; font-size:.95rem; background:var(--surface); color:var(--text); outline:none; transition:border-color .2s; box-sizing:border-box; }
body.ltr .kb-search { padding:12px 42px 12px 16px; }
.kb-search:focus { border-color:var(--primary); }
.kb-search-icon { position:absolute; top:50%; transform:translateY(-50%); right:14px; color:var(--text-muted); }
body.ltr .kb-search-icon { right:auto; left:14px; }
.filter-tabs { display:flex; gap:8px; flex-wrap:wrap; }
.filter-tab { padding:8px 16px; border:1.5px solid var(--border); border-radius:999px; background:none; font-family:inherit; font-size:.82rem; font-weight:600; cursor:pointer; color:var(--text-muted); transition:all .2s; }
.filter-tab.active, .filter-tab:hover { border-color:var(--primary); color:var(--primary); background:rgba(26,79,114,.06); }
.kb-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.kb-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; transition:all .2s; cursor:pointer; display:flex; flex-direction:column; }
.kb-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--primary); }
.kb-card-top { display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; }
.kb-icon { width:42px; height:42px; border-radius:10px; background:rgba(26,79,114,.1); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
.kb-title { font-size:.95rem; font-weight:700; line-height:1.4; }
.kb-excerpt { font-size:.82rem; color:var(--text-muted); line-height:1.6; flex:1; margin-bottom:14px; }
.kb-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.kb-tags { display:flex; gap:6px; flex-wrap:wrap; }
.kb-tag { font-size:.7rem; padding:3px 9px; border-radius:999px; background:rgba(26,79,114,.08); color:var(--primary); font-weight:600; border:1px solid rgba(26,79,114,.15); }
.read-more { font-size:.78rem; color:var(--primary); font-weight:700; display:flex; align-items:center; gap:4px; }
.no-results { text-align:center; padding:60px 20px; color:var(--text-muted); }
.no-results i { font-size:2.5rem; margin-bottom:16px; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; padding:16px; }
.modal-overlay.open { display:flex; }
.modal-box { background:var(--surface); border-radius:16px; padding:28px; max-width:680px; width:100%; max-height:88vh; overflow-y:auto; position:relative; }
.modal-close { position:absolute; top:14px; left:14px; background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted); }
body.ltr .modal-close { left:auto; right:14px; }
.article-body { font-size:.92rem; line-height:1.85; color:var(--text); }
.article-body h3 { font-size:1rem; font-weight:700; margin:18px 0 8px; color:var(--primary); }
.article-body ul { padding-right:20px; }
body.ltr .article-body ul { padding-right:0; padding-left:20px; }
.article-body li { margin-bottom:6px; }
</style>
</head>
<body class="page-layout">
<div id="shell"></div>
<div class="page-content">
  <div class="page-header">
    <div>
      <h1 class="page-title"><span class="ar-text">قاعدة المعرفة</span><span class="en-text">Knowledge Base</span></h1>
      <p class="page-subtitle"><span class="ar-text">مرجع سريع لمقدمي الخدمة</span><span class="en-text">Quick reference for service providers</span></p>
    </div>
    <div style="font-size:.9rem;color:var(--text-muted);"><span id="resultCount"></span></div>
  </div>
  <div class="kb-toolbar">
    <div class="kb-search-wrap">
      <i class="fa-solid fa-magnifying-glass kb-search-icon"></i>
      <input class="kb-search" type="text" id="kbSearch" placeholder="ابحث عن مقالة أو كلمة مفتاحية..." oninput="filterArticles()">
    </div>
    <div class="filter-tabs" id="filterTabs"></div>
  </div>
  <div class="kb-grid" id="kbGrid"></div>
  <div class="no-results" id="noResults" style="display:none;">
    <i class="fa-solid fa-magnifying-glass"></i>
    <p><span class="ar-text">لا توجد نتائج لبحثك</span><span class="en-text">No results found</span></p>
  </div>
</div>

<div class="modal-overlay" id="articleModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeArticle()"><i class="fa-solid fa-xmark"></i></button>
    <div id="articleContent"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
App.requireAuth();
document.getElementById('shell').innerHTML = buildSidebar('knowledge.html') + buildTopbar('قاعدة المعرفة','Knowledge Base');
App.init();

var allTags = [];
SPF.knowledge_articles.forEach(function(a) {
  if (a.tag_ar && allTags.findIndex(function(t) { return t.ar === a.tag_ar; }) < 0) {
    allTags.push({ ar: a.tag_ar, en: a.tag_en });
  }
});
var activeTag = null;

var iconMap = {
  'التعريفات':'📚', 'المنافع':'🏆', 'التأمين':'🛡️', 'الاشتراكات':'💰',
  'المعاشات':'🧓', 'الإجراءات':'📋', 'الحقوق':'⚖️', 'التقادم':'⏳',
  'إصابات العمل':'🏥', 'الأمان الوظيفي':'💼', 'العجز':'♿', 'الأمومة':'👶'
};

function buildFilterTabs() {
  var html = '<button class="filter-tab ' + (!activeTag ? 'active' : '') + '" onclick="setTag(null)">' +
    '<span class="ar-text">الكل</span><span class="en-text">All</span></button>';
  allTags.forEach(function(t) {
    html += '<button class="filter-tab ' + (activeTag === t.ar ? 'active' : '') + '" onclick="setTag(\'' + t.ar.replace(/'/g,"\\'") + '\')">' +
      '<span class="ar-text">' + t.ar + '</span><span class="en-text">' + t.en + '</span></button>';
  });
  document.getElementById('filterTabs').innerHTML = html;
}

function setTag(tag) {
  activeTag = tag;
  buildFilterTabs();
  filterArticles();
  App.applyLang();
}

function filterArticles() {
  var query = document.getElementById('kbSearch').value.toLowerCase().trim();
  var results = SPF.knowledge_articles.filter(function(a) {
    var matchTag = !activeTag || a.tag_ar === activeTag;
    var matchQuery = !query ||
      a.title_ar.toLowerCase().includes(query) ||
      a.title_en.toLowerCase().includes(query) ||
      (a.excerpt_ar || '').toLowerCase().includes(query) ||
      (a.excerpt_en || '').toLowerCase().includes(query) ||
      (a.tag_ar || '').includes(query) ||
      (a.tag_en || '').toLowerCase().includes(query);
    return matchTag && matchQuery;
  });
  var countEl = document.getElementById('resultCount');
  countEl.innerHTML = '<span class="ar-text">' + results.length + ' نتيجة</span><span class="en-text">' + results.length + ' results</span>';
  document.getElementById('kbGrid').style.display = results.length ? '' : 'none';
  document.getElementById('noResults').style.display = results.length ? 'none' : '';
  if (results.length) {
    document.getElementById('kbGrid').innerHTML = results.map(function(a) {
      var icon = iconMap[a.tag_ar] || '📋';
      var tagHtml = '<span class="kb-tag"><span class="ar-text">' + (a.tag_ar||'') + '</span><span class="en-text">' + (a.tag_en||'') + '</span></span>';
      return '<div class="kb-card" onclick="openArticle(' + a.id + ')">' +
        '<div class="kb-card-top"><div class="kb-icon">' + icon + '</div>' +
        '<div class="kb-title"><span class="ar-text">' + a.title_ar + '</span><span class="en-text">' + a.title_en + '</span></div></div>' +
        '<div class="kb-excerpt"><span class="ar-text">' + (a.excerpt_ar || '') + '</span><span class="en-text">' + (a.excerpt_en || '') + '</span></div>' +
        '<div class="kb-footer"><div class="kb-tags">' + tagHtml + '</div>' +
        '<span class="read-more"><span class="ar-text">اقرأ المزيد</span><span class="en-text">Read more</span> <i class="fa-solid fa-arrow-left"></i></span></div>' +
        '</div>';
    }).join('');
  }
  App.applyLang();
}

function openArticle(id) {
  var a = SPF.knowledge_articles.find(function(x) { return x.id === id; });
  if (!a) return;
  var tagHtml = '<span class="kb-tag"><span class="ar-text">' + (a.tag_ar||'') + '</span><span class="en-text">' + (a.tag_en||'') + '</span></span>';
  document.getElementById('articleContent').innerHTML =
    '<div style="margin-bottom:16px;">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">' + tagHtml + '</div>' +
      '<h2 style="font-size:1.2rem;font-weight:800;margin-bottom:8px;"><span class="ar-text">' + a.title_ar + '</span><span class="en-text">' + a.title_en + '</span></h2>' +
    '</div>' +
    '<div class="article-body"><span class="ar-text">' + (a.excerpt_ar || 'المحتوى سيتوفر قريباً') + '</span><span class="en-text">' + (a.excerpt_en || 'Full content coming soon.') + '</span></div>';
  document.getElementById('articleModal').classList.add('open');
  App.applyLang();
}

function closeArticle() { document.getElementById('articleModal').classList.remove('open'); }
document.getElementById('articleModal').addEventListener('click', function(e) { if (e.target === this) closeArticle(); });

buildFilterTabs();
filterArticles();
</script>
</body>
</html>
